apiVersion: apps/v1
kind: Deployment
metadata:
  name: apple-health-lake-mcp
  namespace: default
  labels:
    app.kubernetes.io/instance: apple-health-lake
    app.kubernetes.io/name: apple-health-lake
    app.kubernetes.io/component: mcp-server
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: apple-health-lake
      app.kubernetes.io/instance: apple-health-lake
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apple-health-lake
        app.kubernetes.io/instance: apple-health-lake
        app.kubernetes.io/component: mcp-server
    spec:
      serviceAccountName: apple-health-lake
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      containers:
        - name: mcp-server
          image: "ghcr.io/arjansiemons/apple-health-lake-mcp:0.2.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 65532 # distroless "nonroot" image uses a non-numeric user; kubelet can't verify non-root without a numeric UID
            capabilities:
              drop: ["ALL"]
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apple-health-lake-secrets
                  key: MCP_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: apple-health-lake-secrets
                  key: DATABASE_URL
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
