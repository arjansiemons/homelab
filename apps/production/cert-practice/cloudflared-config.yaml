apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-practice-cloudflared-config
  namespace: default
data:
  # Public access to cert-practice through Cloudflare. Mirrors the ingress:
  # /api goes to the backend, everything else to the frontend. Cloudflare adds a
  # Cf-Connecting-Ip header, which makes the backend require a username.
  config.yaml: |
    tunnel: d7a72912-d51e-4eec-b893-ee1f7cd975b6
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: cert-practice.siemons-it.nl
        path: ^/api(/|$)
        service: http://cert-practice-backend.default.svc.cluster.local:8000
      - hostname: cert-practice.siemons-it.nl
        service: http://cert-practice-frontend.default.svc.cluster.local:80
      - service: http_status:404
