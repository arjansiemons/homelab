kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: zigbee2mqtt-claim-longhorn
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
