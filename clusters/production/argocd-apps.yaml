apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argocd-apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/argocd/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  dependsOn:
    - name: infrastructure
