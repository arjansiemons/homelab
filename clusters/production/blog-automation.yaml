---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: blog
  namespace: flux-system
spec:
  image: ghcr.io/arjansiemons/hugo-site
  interval: 1m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: blog
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: blog
  interval: 1m0s
  # hugo-site's CI only publishes "latest"/"buildcache"/<git-sha> tags, none
  # of which are semver - a semver policy can never resolve a "latest
  # version" from that list. Track the "latest" tag's digest instead (the
  # documented Flux pattern for a repo without semver releases).
  filterTags:
    pattern: '^latest$'
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: blog
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: homelab
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: 'update blog image to {{{{ .Updated.Tag }}}}'
    push:
      branch: main
  update:
    strategy: Setters
