apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@github.com/arjansiemons/homelab-private
    targetRevision: main
    path: apps/production/hermes-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes-agent
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
