apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
  annotations:
    # Moving to homelab-private (homelab-private-apps); keep Flux from
    # deleting the object when it leaves this kustomization.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  project: default
  source:
    repoURL: ssh://git@github.com/arjansiemons/homelab-private
    targetRevision: main
    path: apps/production/homepage
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
