apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 1h
  chart:
    spec:
      chart: argo-cd
      version: "10.9.2"
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: argocd
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    configs:
      params:
        server.insecure: true
    server:
      ingress:
        enabled: true
        ingressClassName: traefik
        hostname: argocd.local.siemons-it.nl
        extraTls:
          - hosts:
              - argocd.local.siemons-it.nl
            secretName: local-siemons-it-nl-tls
