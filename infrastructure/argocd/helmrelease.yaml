apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 1h
  chart:
    spec:
      chart: argo-cd
      version: "10.9.2"
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: argocd
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    configs:
      params:
        server.insecure: true
      cm:
        # Chart default excludes Endpoints/EndpointSlice entirely, which silently
        # skips manually-authored EndpointSlices (e.g. selector-less Services
        # pointing at hosts outside the cluster, like home-assistant). Re-include
        # them so Argo actually applies and self-heals those; keep the rest of
        # the chart's default exclusions to avoid re-introducing that noise.
        resource.exclusions: |
          - apiGroups:
              - coordination.k8s.io
            kinds:
              - Lease
          - apiGroups:
              - authentication.k8s.io
              - authorization.k8s.io
            kinds:
              - SelfSubjectReview
              - TokenReview
              - LocalSubjectAccessReview
              - SelfSubjectAccessReview
              - SelfSubjectRulesReview
              - SubjectAccessReview
          - apiGroups:
              - certificates.k8s.io
            kinds:
              - CertificateSigningRequest
          - apiGroups:
              - cert-manager.io
            kinds:
              - CertificateRequest
          - apiGroups:
              - cilium.io
            kinds:
              - CiliumIdentity
              - CiliumEndpoint
              - CiliumEndpointSlice
          - apiGroups:
              - kyverno.io
              - reports.kyverno.io
              - wgpolicyk8s.io
            kinds:
              - PolicyReport
              - ClusterPolicyReport
              - EphemeralReport
              - ClusterEphemeralReport
              - AdmissionReport
              - ClusterAdmissionReport
              - BackgroundScanReport
              - ClusterBackgroundScanReport
              - UpdateRequest
    server:
      ingress:
        enabled: true
        ingressClassName: traefik
        hostname: argocd.local.siemons-it.nl
        extraTls:
          - hosts:
              - argocd.local.siemons-it.nl
            secretName: local-siemons-it-nl-tls
