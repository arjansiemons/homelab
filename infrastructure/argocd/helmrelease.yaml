apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 1h
  chart:
    spec:
      chart: argo-cd
      version: "10.9.2"
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: argocd
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    configs:
      params:
        server.insecure: true
      cm:
        # Traefik in this cluster doesn't populate Ingress status.loadBalancer
        # (providers.kubernetesIngress.publishedService.enabled: false), so Argo's
        # built-in Ingress health check would otherwise report "Progressing" forever.
        resource.customizations.health.networking.k8s.io_Ingress: |
          hs = {}
          hs.status = "Healthy"
          hs.message = "Ingress is considered healthy"
          return hs
    server:
      ingress:
        enabled: true
        ingressClassName: traefik
        hostname: argocd.local.siemons-it.nl
        extraTls:
          - hosts:
              - argocd.local.siemons-it.nl
            secretName: local-siemons-it-nl-tls
