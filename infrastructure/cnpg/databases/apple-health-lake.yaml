apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: apple-health-lake-postgres
  namespace: postgresql-system
spec:
  instances: 2  # migrated to Longhorn: apple-health-lake-postgres-5 (work-03) replaced apple-health-lake-postgres-1 as the replica. Primary (apple-health-lake-postgres-4) stays on proxmox-csi-nvme for now.
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: apple-health-lake-postgres
  backup:
    barmanObjectStore:
      destinationPath: s3://homelab-backups-prod/cnpg/apple-health-lake-postgres
      endpointURL: https://s3.eu-central-003.backblazeb2.com
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-b2-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-b2-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
    retentionPolicy: "14d"
  storage:
    size: 5Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: apple_health
      owner: applehealthlake
