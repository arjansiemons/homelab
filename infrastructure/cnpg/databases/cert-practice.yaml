apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cert-practice-postgres
  namespace: postgresql-system
spec:
  instances: 3  # 3 instances so CNPG's PDB allows voluntary eviction of one replica during kubectl drain (2 instances blocks all disruption, see CNPG docs).
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  probes:
    startup:
      failureThreshold: 30  # 300s: recovery/basebackup needs room to finish under load instead of being killed mid-startup and looping forever
      timeoutSeconds: 5
    liveness:
      timeoutSeconds: 5
    readiness:
      timeoutSeconds: 5
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: cert-practice-postgres
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway  # best-effort: prefer spreading across pve/pve2 hosts, but don't block scheduling if pve2 has no room
      labelSelector:
        matchLabels:
          cnpg.io/cluster: cert-practice-postgres
  backup:
    barmanObjectStore:
      destinationPath: s3://homelab-backups-prod/cnpg/cert-practice-postgres
      endpointURL: https://s3.eu-central-003.backblazeb2.com
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-b2-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-b2-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
    retentionPolicy: "14d"
  storage:
    size: 5Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: cert_practice
      owner: certpractice
