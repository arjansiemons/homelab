apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-postgres
  namespace: postgresql-system
spec:
  instances: 3  # 3 instances so CNPG's PDB allows voluntary eviction of one replica during kubectl drain (2 instances blocks all disruption, see CNPG docs).
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  probes:
    startup:
      failureThreshold: 30  # 300s: recovery/basebackup needs room to finish under load instead of being killed mid-startup and looping forever
      timeoutSeconds: 5
    liveness:
      timeoutSeconds: 5
    readiness:
      timeoutSeconds: 5
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: n8n-postgres
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway  # best-effort: prefer spreading across pve/pve2 hosts, but don't block scheduling if pve2 has no room
      labelSelector:
        matchLabels:
          cnpg.io/cluster: n8n-postgres
  backup:
    barmanObjectStore:
      destinationPath: s3://homelab-backups-prod/cnpg/n8n-postgres-restored  # new empty path: CNPG refuses to archive WAL into the same non-empty path used to restore from
      endpointURL: https://s3.eu-central-003.backblazeb2.com
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-b2-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-b2-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
    retentionPolicy: "14d"
  storage:
    size: 10Gi
    storageClass: longhorn
  bootstrap:
    recovery:
      source: n8n-postgres-backup  # restored from the last good backup after the cluster's own instances got stuck in an unrecoverable restart loop
      recoveryTarget:
        backupID: "20260911T230200"  # last good backup (2026-09-11 23:02), before the cluster got stuck
        targetImmediate: true  # stop at the backup's own consistency point - avoids replaying extra WAL via externalClusters, which hits a CNPG bug ("failed to get envs: cache miss") every time
  externalClusters:
    - name: n8n-postgres-backup
      barmanObjectStore:
        destinationPath: s3://homelab-backups-prod/cnpg/n8n-postgres
        serverName: n8n-postgres  # backups are stored under the original cluster's name, not this externalCluster's name
        endpointURL: https://s3.eu-central-003.backblazeb2.com
        s3Credentials:
          accessKeyId:
            name: cnpg-backup-b2-credentials
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: cnpg-backup-b2-credentials
            key: ACCESS_SECRET_KEY
        wal:
          maxParallel: 4

