apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-postgres
  namespace: postgresql-system
spec:
  instances: 2  # migrated to Longhorn: n8n-postgres-12 (work-03) replaced n8n-postgres-8 as the replica. Primary (n8n-postgres-11) stays on proxmox-csi-nvme for now.
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: n8n-postgres
  backup:
    barmanObjectStore:
      destinationPath: s3://homelab-backups-prod/cnpg/n8n-postgres
      endpointURL: https://s3.eu-central-003.backblazeb2.com
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-b2-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-b2-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
    retentionPolicy: "14d"
  storage:
    size: 10Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: n8n
      owner: n8n

