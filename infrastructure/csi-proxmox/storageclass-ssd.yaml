apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: proxmox-csi-ssd
mountOptions:
  - noatime
parameters:
  cache: writethrough
  csi.storage.k8s.io/fstype: ext4
  ssd: "true"
  storage: ssd-k8s
provisioner: csi.proxmox.sinextra.dev
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
