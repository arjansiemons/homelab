apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  timeout: 15m  # default 5m is too tight for the longhorn-manager DaemonSet rollout on this small cluster
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: longhorn
      version: "1.12.x"  # Longhorn refuses to skip minor versions (e.g. 1.9->1.12 fails pre-upgrade check) - bumped one minor at a time: 1.9 -> 1.10 -> 1.11 -> 1.12 (latest)
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn
      createDefaultDiskLabeledNodes: true
      replicaSoftAntiAffinity: false
      replicaZoneSoftAntiAffinity: true
      defaultReplicaCount: 2
      replicaAutoBalance: least-effort  # auto-rebalance replicas across zones instead of needing manual intervention
      storageMinimalAvailablePercentage: 10  # we use a dedicated disk (not the root disk), so Longhorn's own guidance is 10% not the 25% default
    persistence:
      defaultClass: false
      defaultClassReplicaCount: 2
