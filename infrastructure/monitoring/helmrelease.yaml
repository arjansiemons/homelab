apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=60.0.0 <70.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              namespace: monitoring
              name: kube-prometheus-stack-alertmanager
            patch: |
              - op: replace
                path: /spec/ports/0/targetPort
                value: http-web
          - target:
              kind: Service
              namespace: monitoring
              name: kube-prometheus-stack-grafana
            patch: |
              - op: replace
                path: /spec/ports/0/targetPort
                value: grafana
          - target:
              kind: Service
              namespace: monitoring
              name: kube-prometheus-stack-prometheus
            patch: |
              - op: replace
                path: /spec/ports/0/targetPort
                value: http-web
          - target:
              kind: Service
              namespace: monitoring
              name: kube-prometheus-stack-kube-state-metrics
            patch: |
              - op: replace
                path: /spec/ports/0/targetPort
                value: http
          - target:
              kind: Service
              namespace: monitoring
              name: kube-prometheus-stack-prometheus-node-exporter
            patch: |
              - op: replace
                path: /spec/ports/0/targetPort
                value: http-metrics
          - target:
              kind: Service
              namespace: kube-system
              name: kube-prometheus-stack-coredns
            patch: |
              - op: replace
                path: /spec/ports/0/targetPort
                value: metrics
          - target:
              kind: DaemonSet
              namespace: monitoring
              name: kube-prometheus-stack-prometheus-node-exporter
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: 25m
                    memory: 64Mi
                  limits:
                    cpu: 1000m
                    memory: 256Mi
          - target:
              kind: ServiceAccount
              namespace: monitoring
              name: kube-prometheus-stack-alertmanager
            patch: |
              - op: add
                path: /automountServiceAccountToken
                value: false
          - target:
              kind: ServiceAccount
              namespace: monitoring
              name: kube-prometheus-stack-grafana
            patch: |
              - op: add
                path: /automountServiceAccountToken
                value: false
          - target:
              kind: Deployment
              namespace: monitoring
              name: kube-prometheus-stack-kube-state-metrics
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: 300m
                    memory: 384Mi
          - target:
              kind: Deployment
              namespace: monitoring
              name: kube-prometheus-stack-operator
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
  values:
    defaultRules:
      disabled:
        CPUThrottlingHigh: true
    additionalPrometheusRulesMap:
      custom-cpu-throttling:
        groups:
          - name: kubernetes-apps
            rules:
              - alert: CPUThrottlingHigh
                expr: |
                  sum(increase(container_cpu_cfs_throttled_periods_total{container!="",container!~"node-exporter|grafana-sc-.*"}[5m])) by (container, pod, namespace)
                    /
                  sum(increase(container_cpu_cfs_periods_total{container!="",container!~"node-exporter|grafana-sc-.*"}[5m])) by (container, pod, namespace)
                    > (25 / 100)
                for: 15m
                labels:
                  severity: warning
                annotations:
                  description: "{{ $value | humanizePercentage }} throttling of CPU in namespace {{ $labels.namespace }} for container {{ $labels.container }} in pod {{ $labels.pod }}."
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/cputhrottlinghigh
                  summary: Processes experience elevated CPU throttling.
              - alert: CPUThrottlingHigh
                expr: |
                  sum(increase(container_cpu_cfs_throttled_periods_total{container=~"node-exporter|grafana-sc-.*"}[5m])) by (container, pod, namespace)
                    /
                  sum(increase(container_cpu_cfs_periods_total{container=~"node-exporter|grafana-sc-.*"}[5m])) by (container, pod, namespace)
                    > (50 / 100)
                for: 15m
                labels:
                  severity: warning
                annotations:
                  description: "{{ $value | humanizePercentage }} throttling of CPU in namespace {{ $labels.namespace }} for container {{ $labels.container }} in pod {{ $labels.pod }}."
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/cputhrottlinghigh
                  summary: Processes experience elevated CPU throttling.
    prometheusOperator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    # Cuts ~42k of the ~60k apiserver series (measured via /api/v1/status/tsdb) and
    # halves apiserver/kubelet scrape cost — not needed at homelab scale/retention.
    kubeApiServer:
      serviceMonitor:
        interval: 60s
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: "apiserver_request_body_size_bytes_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_response_sizes_bucket|apiserver_watch_list_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_watch_events_sizes_bucket|etcd_request_duration_seconds_bucket"
            action: drop
    kubelet:
      serviceMonitor:
        interval: 60s
    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: local-siemons-it-nl
        hosts:
          - alertmanager.local.siemons-it.nl
        tls:
          - secretName: local-siemons-it-nl-tls
            hosts:
              - alertmanager.local.siemons-it.nl
    grafana:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      initChownData:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: monitoring
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: local-siemons-it-nl
        hosts:
          - grafana.local.siemons-it.nl
        tls:
          - secretName: local-siemons-it-nl-tls
            hosts:
              - grafana.local.siemons-it.nl
      persistence:
        enabled: true
        storageClassName: proxmox-csi-nvme
        accessModes:
          - ReadWriteOnce
        size: 5Gi
    prometheus:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: local-siemons-it-nl
        hosts:
          - prom.local.siemons-it.nl
        tls:
          - secretName: local-siemons-it-nl-tls
            hosts:
              - prom.local.siemons-it.nl
      prometheusSpec:
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
        retention: 10d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: proxmox-csi-nvme
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 384Mi
