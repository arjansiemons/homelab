apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: "32.1.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  values:
    globalArguments:
      - --global.sendanonymoususage=false
      - --global.checknewversion=false
    additionalArguments:
      - --serversTransport.insecureSkipVerify=true
      - --log.level=INFO
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    deployment:
      enabled: true
      replicas: 3
      podAnnotations: {}
      additionalContainers: []
      initContainers: []
      annotations: {}
    rbac:
      enabled: true
    service:
      type: LoadBalancer
      enabled: true
      single: true
      spec: {}
      labels: {}
      annotations:
        lbipam.cilium.io/ips: 192.168.2.68
      externalIPs: []
      loadBalancerSourceRanges: []
    ports:
      web:
        redirectTo:
          port: websecure
      websecure:
        expose:
          default: true
        tls:
          enabled: true
        http3:
          enabled: true
          advertisedPort: null
    providers:
      kubernetesCRD:
        enabled: true
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: false
        allowExternalNameServices: true
    ingressRoute:
      dashboard:
        enabled: true
  install:
    crds: Create
    timeout: 2m
  upgrade:
    crds: CreateReplace
    timeout: 2m
