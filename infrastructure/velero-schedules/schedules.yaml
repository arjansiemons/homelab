apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: pvc-full-daily
  namespace: velero
spec:
  schedule: "0 3 * * *"
  template:
    ttl: 336h0m0s
    storageLocation: default
    includedNamespaces:
      - '*'
    excludedNamespaces:
      - arc-runners
    # PVCs go through fs-backup (kopia); there is no VolumeSnapshotClass, so
    # snapshot attempts on unmounted PVCs can only fail.
    snapshotVolumes: false
    defaultVolumesToFsBackup: true
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy
    includeClusterResources: true
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: pvc-full-weekly-archive
  namespace: velero
spec:
  schedule: "0 4 * * 0"
  template:
    ttl: 2160h0m0s
    storageLocation: default
    includedNamespaces:
      - '*'
    excludedNamespaces:
      - arc-runners
    # PVCs go through fs-backup (kopia); there is no VolumeSnapshotClass, so
    # snapshot attempts on unmounted PVCs can only fail.
    snapshotVolumes: false
    defaultVolumesToFsBackup: true
    resourcePolicy:
      kind: configmap
      name: velero-volume-policy
    includeClusterResources: true
