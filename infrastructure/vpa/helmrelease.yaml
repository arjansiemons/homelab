apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: kube-system
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: vpa
      version: "5.0.x"
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: flux-system
  values:
    metrics-server:
      enabled: false  # already running our own metrics-server
    recommender:
      enabled: true
      extraArgs:
        v: "2"
        pod-recommendation-min-cpu-millicores: 5
        pod-recommendation-min-memory-mb: 10
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    # Needed so VPA objects with updateMode: InPlaceOrRecreate/Recreate can
    # actually apply their recommendation, not just report it. Individual
    # VerticalPodAutoscaler objects still control their own updateMode, so
    # anything left at "Off" is untouched by these two components.
    updater:
      enabled: true
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    admissionController:
      enabled: true
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
