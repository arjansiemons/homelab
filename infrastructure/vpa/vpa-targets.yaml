# Longhorn's other components (csi-attacher/provisioner/resizer/snapshotter,
# driver-deployer, ui, csi-plugin) have never had any VPA/recommendation
# history at all, unlike longhorn-manager above. Start Off (observe-only)
# to gather real data before trusting an auto-applied value, same
# discipline as every other component's first round. The engine-image-*
# DaemonSet is deliberately excluded - its name is tied to the current
# engine image hash and gets replaced wholesale on every Longhorn upgrade,
# so a VPA targeting today's name would silently stop matching anything.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: longhorn-csi-attacher
  namespace: longhorn-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: csi-attacher
  updatePolicy:
    updateMode: "Off"
---
