# Actively-applied (InPlaceOrRecreate) VPAs: reviewed recommendations we trust
# enough to let VPA apply automatically, without a pod restart when possible.
# Everything else in the cluster still has an Off-mode VPA (either one of the
# goldilocks-* objects left behind by a since-removed Goldilocks install, now
# getting fresh data again from our recommender, or none yet) and stays
# observe-only until reviewed the same way.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: longhorn-manager
  namespace: longhorn-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: longhorn-manager
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: goldilocks-cilium
  namespace: kube-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: cilium
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: goldilocks-cert-manager
  namespace: cert-manager
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cert-manager
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
---
