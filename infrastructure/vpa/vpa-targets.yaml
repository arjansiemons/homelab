# Recommendation-only (updateMode: "Off") VPA for the one component not already
# covered by the goldilocks-* VPA objects left behind by a since-removed
# Goldilocks install (those cover most of the cluster already and get fresh
# data again now that a recommender is running; no need to duplicate them here).
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: longhorn-manager
  namespace: longhorn-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: longhorn-manager
  updatePolicy:
    updateMode: "Off"
